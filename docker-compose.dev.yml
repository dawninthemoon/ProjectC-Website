services:
  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command: sleep infinity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__GameDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projectc_analytics};Username=${POSTGRES_USER:-projectc};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Battle__ApiKey: ${BATTLE_API_KEY:?Set BATTLE_API_KEY in .env}
      Refresh__LifetimeDays: ${REFRESH_LIFETIME_DAYS:-30}
    volumes:
      - .:/workspace
      - nuget_cache:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  nuget_cache:
