services:
  postgres:
    image: postgres:17
    container_name: projectc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectc
      POSTGRES_PASSWORD: projectc_dev_password
      POSTGRES_DB: projectc_analytics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectc -d projectc_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: