name: Archived ASP.NET Core reference checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: projectc_test
          POSTGRES_PASSWORD: integration_tests_only
          POSTGRES_DB: projectc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U projectc_test -d projectc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROJECTC_TEST_DATABASE: Host=localhost;Database=projectc_test;Username=projectc_test;Password=integration_tests_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet restore ProjectC.sln
      - run: dotnet build ProjectC.sln --no-restore --configuration Release
      - run: dotnet test ProjectC.sln --no-build --configuration Release
      - run: dotnet publish api/ProjectC.Api --configuration Release --no-restore --output /tmp/projectc-api
